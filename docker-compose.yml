# Ambiente local de desenvolvimento.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maesegura
      POSTGRES_USER: maesegura
      POSTGRES_PASSWORD: maesegura
    volumes:
      - dados-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maesegura"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DEBUG: "1"
      SECRET_KEY: dev
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: maesegura
      POSTGRES_USER: maesegura
      POSTGRES_PASSWORD: maesegura
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-dev:
